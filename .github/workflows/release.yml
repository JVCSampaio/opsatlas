name: Publish containers
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v0.1.0
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: api, context: '.'}
          - {name: web, context: './web'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.release.tag_name || inputs.tag || github.ref }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: '${{ matrix.context }}'
          push: true
          tags: 'ghcr.io/jvcsampaio/opsatlas-${{ matrix.name }}:${{ github.event.release.tag_name || inputs.tag || github.ref_name }}'
          labels: |
            org.opencontainers.image.source=https://github.com/JVCSampaio/opsatlas
            org.opencontainers.image.licenses=MIT
