[project]
name = "opsatlas"
version = "0.1.0"
description = "Consulta de procedimentos técnicos com RAG, fontes e indexação por eventos"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1", "confluent-kafka>=2.8,<3", "pymongo>=4.11,<5",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pytest-cov>=6,<8", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsatlas"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
