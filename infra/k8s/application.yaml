apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          command: [sh, -c, 'until pg_isready -h postgres -U opsatlas; do sleep 3; done']
      containers:
        - name: api
          image: opsatlas-api:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: app-config}}]
          ports: [{containerPort: 8000}]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          startupProbe: {httpGet: {path: /health/ready, port: 8000}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 5}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      initContainers:
        - name: wait-api
          image: busybox:1.37
          command: [sh, -c, 'until wget -qO- http://api:8000/health/ready; do sleep 3; done']
      containers:
        - name: worker
          image: opsatlas-api:local
          imagePullPolicy: IfNotPresent
          command: [/app/.venv/bin/python, -m, opsatlas.worker]
          envFrom: [{configMapRef: {name: app-config}}]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: opsatlas-web:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          readinessProbe: {httpGet: {path: /, port: 80}}
