apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: opsatlas}
            - {name: POSTGRES_PASSWORD, value: local-demo-password}
            - {name: POSTGRES_DB, value: opsatlas}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {exec: {command: [pg_isready, -U, opsatlas]}, initialDelaySeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: mongo}
spec:
  selector: {app: mongo}
  ports: [{port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo}
spec:
  serviceName: mongo
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata: {labels: {app: mongo}}
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          ports: [{containerPort: 27017}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {exec: {command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]}, initialDelaySeconds: 10}
          volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  selector: {app: kafka}
  ports: [{name: broker, port: 9092}, {name: controller, port: 9093}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          env:
            - {name: KAFKA_NODE_ID, value: '1'}
            - {name: KAFKA_PROCESS_ROLES, value: 'broker,controller'}
            - {name: KAFKA_LISTENERS, value: 'PLAINTEXT://:9092,CONTROLLER://:9093'}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://kafka:9092'}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@kafka:9093'}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1'}
            - {name: KAFKA_LOG_DIRS, value: /tmp/kraft-combined-logs}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: '2', memory: 1Gi}}
          readinessProbe: {tcpSocket: {port: 9092}, initialDelaySeconds: 20}
          volumeMounts: [{name: data, mountPath: /tmp/kraft-combined-logs}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
